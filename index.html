<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>NRL 2027 — Live progress</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--y:#ffd502;--ink:#000;--bg:#f3f2f2;--card:#fff;--line:#c9c7c2;--soft:#e8e6e2;--mute:#4a4a4a;--dim:#8a8884}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 Archivo,"Helvetica Neue",Arial,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.02em}
.mono{font-weight:700;letter-spacing:.01em}
.k{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
.mute{color:var(--mute)}
header{background:#000;color:#fff;padding:12px 14px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:40}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand img{height:26px;width:auto;display:block}
.brand span{font-weight:800;font-size:17px;letter-spacing:-.02em}
.brand span i{color:var(--y);font-style:normal}
.langs{margin-left:auto;display:flex;gap:2px;flex:none}
.langs button{border:0;background:transparent;color:#c9c7c2;font:inherit;font-size:12px;font-weight:700;padding:6px 8px;cursor:pointer}
.langs button.on{background:var(--y);color:#000}
.days{display:flex;background:#000;border-top:1px solid #2a2a2a;position:sticky;top:50px;z-index:39}
.days button{flex:1;border:0;background:transparent;color:#b9b7b3;font:inherit;font-weight:700;font-size:14px;padding:13px 6px;cursor:pointer;border-bottom:3px solid transparent;min-height:48px}
.days button.on{color:#fff;border-bottom-color:var(--y)}
.bar{background:var(--card);border-bottom:2px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.sel{position:relative}
.sel select{width:100%;min-height:50px;border:2px solid var(--ink);background:var(--card);font:inherit;font-weight:700;font-size:15px;padding:0 40px 0 12px;border-radius:0;appearance:none;cursor:pointer}
.sel::after{content:"";position:absolute;right:16px;top:50%;margin-top:-3px;width:9px;height:9px;border-right:2px solid #000;border-bottom:2px solid #000;transform:rotate(45deg);pointer-events:none}
.find{position:relative}
.find input{width:100%;min-height:46px;border:2px solid var(--line);background:var(--card);font:inherit;font-weight:700;padding:0 12px}
.find input:focus{outline:0;border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--y)}
.sugg{position:absolute;left:0;right:0;top:100%;z-index:38;border:2px solid var(--ink);border-top:0;background:var(--card);box-shadow:0 10px 24px rgba(0,0,0,.16);max-height:60vh;overflow:auto}
.sugg button{display:flex;width:100%;gap:8px;align-items:baseline;text-align:left;border:0;border-top:1px solid var(--soft);background:transparent;font:inherit;padding:11px 12px;cursor:pointer;min-height:44px}
.sugg button:first-child{border-top:0}
.sugg button:active{background:#fffbe0}
.sugg .id{font-weight:800;flex:none}
.sugg .cx{margin-left:auto;padding-left:10px;font-size:12px;line-height:1.4;color:var(--mute);text-align:right}
main{padding:14px 14px 40px;max-width:820px;margin:0 auto}
.cathead{margin:4px 0 16px}
.cathead h1{font-size:22px;line-height:1.2;text-wrap:pretty}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pill{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:5px 9px;border:2px solid var(--ink)}
.pill.live{background:var(--y)}
.pill.done{background:#000;color:var(--y);border-color:#000}
.pill.soft{border-color:var(--line);color:var(--mute)}
section.blk{background:var(--card);border:2px solid var(--line);margin-bottom:14px}
section.blk>h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;padding:12px 14px;border-bottom:2px solid var(--line);background:var(--soft)}
.pad{padding:14px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;padding:14px}
.diagram{display:flex;align-items:stretch;width:max-content;min-width:100%}
.rd{display:flex;flex-direction:column;justify-content:space-around;gap:12px;padding:0 14px;flex:none}
.rd+.rd{border-left:2px solid var(--soft)}
.rd-label{font-size:10px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);text-align:center;padding-bottom:2px}
.nd{display:flex;flex-direction:column;gap:3px}
.nd.mt{gap:3px;padding:6px 0}
.nd-label{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--dim);text-align:center}
.tms{border:2px solid var(--line);background:var(--card)}
.tm{padding:4px 9px;font-size:12px;font-weight:700;border-bottom:1px solid var(--soft);white-space:nowrap;min-width:98px}
.tm:last-child{border-bottom:0}
.tm.adv{background:var(--y)}
.tm.out{color:var(--dim);text-decoration:line-through;text-decoration-thickness:1px}
.tm.wait{color:#a9a7a3}
.tm.hit{box-shadow:inset 0 0 0 3px #000}
.chip{display:block;border:2px solid var(--line);background:var(--card);padding:6px 10px;font-size:12px;font-weight:800;white-space:nowrap;min-width:104px}
.chip .g{font-weight:600;color:var(--dim);padding-left:5px}
.chip.adv{background:var(--y);border-color:var(--ink)}
.chip.big{font-size:15px;padding:9px 11px}
.chip.hit{box-shadow:inset 0 0 0 3px #000}
.chip.pend{color:var(--dim);border-style:dashed;background:#fafaf9;font-weight:700;font-size:11px}
.champ{display:flex;align-items:center;gap:12px;background:#000;color:#fff;padding:14px}
.champ .cid{font-size:20px;font-weight:800;color:var(--y)}
.grp+.grp{border-top:2px solid var(--line)}
.grp-h{display:flex;align-items:baseline;gap:10px;padding:11px 14px;background:#fafaf9;border-bottom:1px solid var(--soft)}
.grp-h b{font-size:13px}
.grp-h span{margin-left:auto;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mute)}
.trow{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--soft);border-left:5px solid transparent}
.trow:last-child{border-bottom:0}
.trow .id{font-weight:800;font-size:14px}
.trow .st{margin-left:auto;font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
.trow.adv{background:#fffbe0;border-left-color:var(--y)}
.trow.adv .st{color:#000}
.trow.out{border-left-color:var(--soft)}
.trow.out .id{color:var(--mute)}
.trow.out .st{color:var(--dim)}
.trow.prog{border-left-color:var(--line)}
.trow.prog .st{color:var(--mute)}
.trow.done{border-left-color:var(--line)}
.trow.done .st{color:var(--mute)}
.trow.hit{box-shadow:inset 0 0 0 3px #000}
.empty{padding:22px 14px;text-align:left}
.empty h3{font-size:16px;margin-bottom:6px}
footer{padding:16px 14px 34px;max-width:820px;margin:0 auto;border-top:2px solid var(--line);display:flex;flex-direction:column;gap:10px}
footer p{margin:0;font-size:12px;line-height:1.6;color:var(--mute)}
.refresh{border:2px solid var(--ink);background:var(--y);font:inherit;font-weight:800;font-size:13px;padding:11px 14px;cursor:pointer;align-self:flex-start;min-height:44px}
@media(min-width:620px){.bar{flex-direction:row;align-items:center}.sel{flex:1 1 auto}.find{flex:1 1 auto}.cathead h1{font-size:27px}}
</style>
</head>
<body>
<header>
  <div class="brand"><img src="nrl-mark.png" alt="" onerror="this.remove()"><span>NRL<i>&thinsp;2027</i></span></div>
  <div class="langs" id="langs"></div>
</header>
<nav class="days" id="days"></nav>
<div class="bar">
  <div class="sel"><select id="cat"></select></div>
  <div class="find"><input id="q" type="search" autocomplete="off" spellcheck="false"><div id="sugg"></div></div>
</div>
<main id="main"></main>
<footer>
  <p id="foot"></p>
  <button class="refresh" id="rf"></button>
</footer>
<script>
var DAYS=['Friday','Saturday','Sunday'];
var T={
 en:{code:'EN',find:'Find your team — type a team ID',days:{Friday:'Friday',Saturday:'Saturday',Sunday:'Sunday',Other:'Other'},
  groups:'Groups',elim:'Elimination round',mtag:'Elimination',champion:'Champion',advanced:'Advanced',eliminated:'Not advancing',prog:'In progress',scored:'Scored',
  complete:'Complete',live:'In progress',waiting:'waiting on {n}',tied:'tied — extra match',unopposed:'unopposed',winner:'winner',
  group:'Group',noneDay:'Nothing published for this day yet',noneDayB:'Results appear here once the organisers publish them.',
  nothing:'Nothing published yet',nothingB:'The organisers have not published any results. Please check back shortly.',
  noMatch:'No team found with that ID.',updated:'Updated',never:'not published yet',
  note:'Scores are not published here. Results are announced on stage; this page shows which teams advance.',refresh:'Refresh',
  ranked:'This category is judged as one ranking. Placings are announced on stage.'},
 ms:{code:'BM',find:'Cari pasukan anda — taip ID pasukan',days:{Friday:'Jumaat',Saturday:'Sabtu',Sunday:'Ahad',Other:'Lain'},
  groups:'Kumpulan',elim:'Peringkat kalah mati',mtag:'Kalah mati',champion:'Johan',advanced:'Layak',eliminated:'Tidak layak',prog:'Sedang berjalan',scored:'Telah dinilai',
  complete:'Tamat',live:'Sedang berjalan',waiting:'menunggu {n}',tied:'seri — perlu perlawanan tambahan',unopposed:'tanpa lawan',winner:'pemenang',
  group:'Kumpulan',noneDay:'Belum ada keputusan untuk hari ini',noneDayB:'Keputusan akan muncul setelah penganjur menerbitkannya.',
  nothing:'Belum ada keputusan',nothingB:'Penganjur belum menerbitkan keputusan. Sila semak semula sebentar lagi.',
  noMatch:'Tiada pasukan dengan ID tersebut.',updated:'Dikemas kini',never:'belum diterbitkan',
  note:'Markah tidak diterbitkan di sini. Keputusan diumumkan di pentas; halaman ini menunjukkan pasukan yang layak.',refresh:'Muat semula',
  ranked:'Kategori ini dinilai sebagai satu kedudukan. Kedudukan diumumkan di pentas.'},
 zh:{code:'中文',find:'查找您的队伍 — 输入队伍编号',days:{Friday:'星期五',Saturday:'星期六',Sunday:'星期日',Other:'其他'},
  groups:'小组',elim:'淘汰赛',mtag:'淘汰',champion:'冠军',advanced:'晋级',eliminated:'未晋级',prog:'进行中',scored:'已评分',
  complete:'已完成',live:'进行中',waiting:'尚待 {n} 项',tied:'并列 — 需加赛',unopposed:'轮空晋级',winner:'待定',
  group:'小组',noneDay:'当天尚未发布成绩',noneDayB:'主办方发布后将显示在此处。',
  nothing:'尚未发布成绩',nothingB:'主办方尚未发布任何成绩，请稍后再查看。',
  noMatch:'找不到该编号的队伍。',updated:'更新于',never:'尚未发布',
  note:'本页不公布分数。成绩以现场宣布为准；此处显示晋级队伍。',refresh:'刷新',
  ranked:'本组别为单一排名，名次以现场宣布为准。'}};

var S={data:null,lang:'en',day:null,cat:null,q:'',hit:null};
var $=function(s){return document.querySelector(s)};
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function t(){return T[S.lang]}
function cats(){return (S.data&&S.data.categories)||[]}
function dayOf(c){return DAYS.indexOf(c.day)>=0?c.day:'Other'}
function daysPresent(){var d=[];cats().forEach(function(c){var k=dayOf(c);if(d.indexOf(k)<0)d.push(k)});return DAYS.filter(function(x){return d.indexOf(x)>=0}).concat(d.indexOf('Other')>=0?['Other']:[])}
function dayCats(){return cats().filter(function(c){return dayOf(c)===S.day})}
function cur(){var l=dayCats();for(var i=0;i<l.length;i++)if(l[i].id===S.cat)return l[i];return l[0]||null}
function isGrouped(c){return !!(c.knockout&&c.knockout.matches&&c.knockout.matches.length)}

function allTeams(){var out=[];cats().forEach(function(c){(c.groups||[]).forEach(function(g){(g.teams||[]).forEach(function(x){out.push({id:x.teamId,name:x.name||'',cat:c,group:g.group,complete:g.complete,status:x.status})})})});return out}

function statusOf(x){
 if(x.status==='scored')return{k:'done',label:t().scored};
 if(!x.complete||x.status==='in progress')return{k:'prog',label:t().prog};
 if(x.status==='advanced')return{k:'adv',label:t().advanced};
 return{k:'out',label:t().eliminated}}

/* ---------- bracket diagram ---------- */
function groupTeams(c,gno){var g=(c.groups||[]).filter(function(x){return String(x.group)===String(gno)})[0];return g?(g.teams||[]):[]}

function roundsOf(c){
 var k=c.knockout;if(!k)return [];
 if(k.rounds&&k.rounds.length)return k.rounds;
 if(k.matches&&k.matches.length)return [{name:t().elim,matches:k.matches}];
 return []}

function groupColumn(c,firstRound){
 var seen={},slots=[];
 (firstRound.matches||[]).forEach(function(m){
  [m.a,m.b].forEach(function(s){
   if(!s||s.group==null||seen[s.group])return;seen[s.group]=1;slots.push(s)})});
 if(!slots.length)return '';
 return '<div class="rd"><div class="rd-label">'+esc(t().groups)+'</div>'
  +slots.map(function(s){
   var teams=groupTeams(c,s.group);
   if(!teams.length)teams=[{teamId:'—',status:'in progress'}];
   return '<div class="nd"><div class="tms">'+teams.map(function(x){
     var cls=!s.complete?'wait':(s.teamId&&x.teamId===s.teamId?'adv':'out');
     return '<div class="tm '+cls+(S.hit===x.teamId?' hit':'')+'" title="'+esc(x.name||x.teamId)+'">'+esc(x.teamId)+'</div>'}).join('')
    +'</div><div class="nd-label">'+esc(t().group)+' '+esc(s.group)
    +(s.complete?'':' · '+esc(t().waiting.replace('{n}',s.pending)))+'</div></div>'}).join('')
  +'</div>'}

function slotChip(s,winner){
 if(!s)return '<div class="chip pend">'+esc(t().unopposed)+'</div>';
 if(!s.teamId){
  var msg=s.tied?t().tied:s.pending?t().waiting.replace('{n}',s.pending):(s.label||t().winner);
  return '<div class="chip pend">'+esc(msg)+'</div>'}
 var won=winner===s.teamId;
 return '<div class="chip'+(won?' adv':'')+(S.hit===s.teamId?' hit':'')+'">'+esc(s.teamId)
  +(s.group!=null?'<span class="g">G'+esc(s.group)+'</span>':'')+'</div>'}

function diagramHtml(c){
 var rounds=roundsOf(c);if(!rounds.length)return '';
 var html=groupColumn(c,rounds[0]);
 rounds.forEach(function(r){
  html+='<div class="rd"><div class="rd-label">'+esc(r.name||'')+'</div>'
   +(r.matches||[]).map(function(m){
     return '<div class="nd mt">'+slotChip(m.a,m.winner)+slotChip(m.b,m.winner)+'</div>'}).join('')
   +'</div>'});
 var champ=c.knockout&&c.knockout.champion;
 html+='<div class="rd"><div class="rd-label">'+esc(t().champion)+'</div><div class="nd">'
  +(champ?'<div class="chip adv big">'+esc(champ.teamId)+'</div>':'<div class="chip pend">'+esc(t().winner)+'</div>')
  +'</div></div>';
 return '<div class="diagram">'+html+'</div>'}

/* ---------- render ---------- */
function render(){
 var L=t();
 $('#langs').innerHTML=Object.keys(T).map(function(k){return '<button class="'+(S.lang===k?'on':'')+'" data-lang="'+k+'">'+T[k].code+'</button>'}).join('');
 $('#q').placeholder=L.find;
 $('#rf').textContent=L.refresh;

 if(!cats().length){
  $('#days').innerHTML='';$('#cat').innerHTML='';$('.bar').style.display='none';
  $('#main').innerHTML='<div class="empty"><h3>'+esc(L.nothing)+'</h3><p class="mute">'+esc(L.nothingB)+'</p></div>';
  foot();return}
 $('.bar').style.display='';

 var dp=daysPresent();
 if(dp.indexOf(S.day)<0)S.day=dp[0];
 $('#days').innerHTML=dp.map(function(d){return '<button class="'+(S.day===d?'on':'')+'" data-day="'+d+'">'+esc(L.days[d]||d)+'</button>'}).join('');

 var list=dayCats();
 $('#cat').innerHTML=list.map(function(c){return '<option value="'+esc(c.id)+'"'+(cur()&&cur().id===c.id?' selected':'')+'>'+esc(c.name)+'</option>'}).join('');
 $('#cat').style.display=list.length?'':'none';

 var c=cur();
 if(!c){$('#main').innerHTML='<div class="empty"><h3>'+esc(L.noneDay)+'</h3><p class="mute">'+esc(L.noneDayB)+'</p></div>';foot();return}

 var groups=c.groups||[],done=groups.filter(function(g){return g.complete}).length;
 var all=groups.length&&done===groups.length;
 var html='<div class="cathead"><h1>'+esc(c.name)+'</h1><div class="badges">'
  +'<span class="pill '+(all?'done':'live')+'">'+esc(all?L.complete:L.live)+'</span>'
  +(groups.length?'<span class="pill soft">'+done+' / '+groups.length+' '+esc(L.groups)+'</span>':'')
  +'</div></div>';

 if(isGrouped(c)){
  html+='<section class="blk"><h2>'+esc(L.elim)+'</h2><div class="scroll">'+diagramHtml(c)+'</div>'
   +(c.knockout.champion?'<div class="champ"><span class="k" style="color:#8a8884">'+esc(L.champion)+'</span><span class="cid">'+esc(c.knockout.champion.teamId)+'</span></div>':'')
   +'</section>'}
 else if(groups.length){html+='<section class="blk"><div class="pad mute" style="font-size:13px">'+esc(L.ranked)+'</div></section>'}

 if(groups.length){
  html+='<section class="blk"><h2>'+esc(L.groups)+'</h2>'+groups.map(function(g){
   return '<div class="grp"><div class="grp-h"><b>'+(String(g.group)==='none'?esc(c.name):esc(L.group)+' '+esc(g.group))+'</b><span>'+esc(g.complete?L.complete:L.prog)+'</span></div>'
    +(g.teams||[]).map(function(x){
      var st=statusOf({complete:g.complete,status:x.status});
      return '<div class="trow '+st.k+(S.hit===x.teamId?' hit':'')+'" data-team="'+esc(x.teamId)+'"><span class="id">'+esc(x.teamId)+'</span>'
       +(x.name?'<span class="mute" style="font-size:13px">'+esc(x.name)+'</span>':'')
       +'<span class="st">'+esc(st.label)+'</span></div>'}).join('')
    +'</div>'}).join('')+'</section>'}

 $('#main').innerHTML=html;
 if(S.hit){var n=document.querySelector('.trow.hit');if(n){var r=n.getBoundingClientRect();window.scrollTo({top:window.pageYOffset+r.top-160,behavior:'smooth'})}}
 foot()}

function foot(){
 var L=t(),p=S.data&&S.data.publishedAt?new Date(S.data.publishedAt):null;
 $('#foot').innerHTML=esc(L.note)+'<br>'+esc(L.updated)+': '+(p?esc(p.toLocaleString()):esc(L.never))}

function suggest(){
 var q=S.q.trim().toUpperCase();
 if(q.length<1){$('#sugg').innerHTML='';return}
 var hits=allTeams().filter(function(x){return String(x.id).toUpperCase().indexOf(q)>=0}).slice(0,7);
 if(!hits.length){$('#sugg').innerHTML='<div class="sugg"><button type="button" disabled style="color:#8a8884">'+esc(t().noMatch)+'</button></div>';return}
 $('#sugg').innerHTML='<div class="sugg">'+hits.map(function(x){
  var st=statusOf(x);
  return '<button type="button" data-go="'+esc(x.cat.id)+'" data-team="'+esc(x.id)+'"><span class="id">'+esc(x.id)+'</span>'
   +'<span class="cx">'+esc(x.cat.name)+'<br>'+esc(t().group)+' '+esc(x.group)+' · '+esc(st.label)+'</span></button>'}).join('')+'</div>'}

document.addEventListener('click',function(e){
 var b=e.target.closest('button');if(!b)return;
 if(b.dataset.lang){S.lang=b.dataset.lang;try{localStorage.setItem('nrl.lang',S.lang)}catch(x){};render();suggest();return}
 if(b.dataset.day){S.day=b.dataset.day;S.cat=null;S.hit=null;render();return}
 if(b.dataset.go){S.hit=b.dataset.team;var c=cats().filter(function(x){return x.id===b.dataset.go})[0];if(c){S.day=dayOf(c);S.cat=c.id}$('#q').value='';S.q='';$('#sugg').innerHTML='';render();return}
});
$('#cat').addEventListener('change',function(e){S.cat=e.target.value;S.hit=null;render()});
$('#q').addEventListener('input',function(e){S.q=e.target.value;suggest()});
$('#rf').addEventListener('click',function(){load(true)});

function fetchJson(u){return fetch(u,{cache:'no-store'}).then(function(r){return r.ok?r.json():null}).catch(function(){return null})}

/* Bandwidth: version.txt is about ten bytes. With a few hundred phones polling
   every 30 seconds, only a changed version pulls the full results file down. */
var LAST_VERSION=null;
function fetchResults(){
 return fetchJson('results.json?t='+Date.now()).then(function(d){
  if(d&&d.categories){S.data=d}else if(!S.data){S.data={categories:[]}}
  render()})}

function load(force){
 return fetch('version.txt?t='+Date.now(),{cache:'no-store'})
  .then(function(r){return r.ok?r.text():null})
  .then(function(v){
   v=v?v.trim():null;
   if(!force&&v&&v===LAST_VERSION&&S.data)return null;
   LAST_VERSION=v;
   return fetchResults()})
  .catch(function(){
   /* No version file (or a stale host cache) — fall back to the full file. */
   return fetchResults()})
  .catch(function(){if(!S.data)S.data={categories:[]};render()})}
